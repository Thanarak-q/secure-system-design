<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 250" width="1020" height="250"
     role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Secure System Design workflow</title>
  <desc id="wf-desc">Requirements to Entities to API to High-Level Design to Threat model to
  Deep Dive to Test plan. The API step sends fields back to Entities. Every stage can send the
  work back to any earlier one, including all the way to Requirements.</desc>
  <style>
    :root, svg {
      --ink:#1a1a18; --muted:#5f5f58; --line:#3a3a36;
      --box:#ffffff; --accent:#3b5bdb; --accent-bg:#eef1fd; --loop:#8b1a1a;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink:#e8e8e4; --muted:#a3a39c; --line:#9a9a92;
        --box:#1d1d23; --accent:#8ea4ff; --accent-bg:#232a45; --loop:#ff9a9a;
      }
    }
    .box   { fill:var(--box); stroke:var(--line); stroke-width:1.5; }
    .box-a { fill:var(--accent-bg); stroke:var(--accent); stroke-width:1.8; }
    .lbl   { fill:var(--ink); font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
             text-anchor:middle; }
    .sub   { fill:var(--muted); font:400 10.5px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
             text-anchor:middle; }
    .arw   { fill:none; stroke:var(--line); stroke-width:1.6; marker-end:url(#a); }
    .back  { fill:none; stroke:var(--muted); stroke-width:1.4; stroke-dasharray:5 4;
             marker-end:url(#am); }
    .loopl { fill:none; stroke:var(--loop); stroke-width:1.8; stroke-dasharray:7 5;
             marker-end:url(#al); }
    .note  { fill:var(--muted); font:400 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
             text-anchor:middle; }
    .noteL { fill:var(--loop); font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
             text-anchor:middle; }
  </style>
  <defs>
    <marker id="a"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--loop)"/></marker>
  </defs>

  <!-- 2c: the API reveals fields the requirements did not mention -->
  <path class="back" d="M364,64 L364,34 L228,34 L228,60"/>
  <text class="note" x="296" y="26">the API reveals fields the entities missed</text>

  <!-- stages -->
  <rect class="box"   x="20"  y="64" width="120" height="48" rx="7"/>
  <text class="lbl"   x="80"  y="86">Requirements</text>
  <text class="sub"   x="80"  y="102">and real numbers</text>

  <rect class="box"   x="162" y="64" width="120" height="48" rx="7"/>
  <text class="lbl"   x="222" y="86">Entities</text>
  <text class="sub"   x="222" y="102">the data model</text>

  <rect class="box"   x="304" y="64" width="120" height="48" rx="7"/>
  <text class="lbl"   x="364" y="86">API</text>
  <text class="sub"   x="364" y="102">the contracts</text>

  <rect class="box"   x="446" y="64" width="120" height="48" rx="7"/>
  <text class="lbl"   x="506" y="86">HLD</text>
  <text class="sub"   x="506" y="102">decisions + reasons</text>

  <rect class="box-a" x="588" y="64" width="120" height="48" rx="7"/>
  <text class="lbl"   x="648" y="86">Threat model</text>
  <text class="sub"   x="648" y="102">one flow at a time</text>

  <rect class="box"   x="730" y="64" width="120" height="48" rx="7"/>
  <text class="lbl"   x="790" y="86">Deep Dive</text>
  <text class="sub"   x="790" y="102">function specs</text>

  <rect class="box"   x="872" y="64" width="120" height="48" rx="7"/>
  <text class="lbl"   x="932" y="86">Test plan</text>
  <text class="sub"   x="932" y="102">who verifies what</text>

  <!-- forward arrows -->
  <path class="arw" d="M140,88 L160,88"/>
  <path class="arw" d="M282,88 L302,88"/>
  <path class="arw" d="M424,88 L444,88"/>
  <path class="arw" d="M566,88 L586,88"/>
  <path class="arw" d="M708,88 L728,88"/>
  <path class="arw" d="M850,88 L870,88"/>

  <!-- the loop back -->
  <path class="loopl" d="M932,112 L932,178 L80,178 L80,116"/>
  <text class="noteL" x="506" y="200">every stage can send you back to any earlier one</text>
  <text class="note"  x="506" y="218">going backwards is the process working — fix the earlier artifact, not just the current one</text>
</svg>
